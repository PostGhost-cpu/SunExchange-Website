<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority/Login</title>
    <link rel="StyleSheet" href="./CSS/stylesheet.css">
    <script  src="./JS/scriptsheet.js"></script>
</head>
<body id="Login_section">
    <section>
        <div class="Login_wapper">
            <form onsubmit="return login_valiation()">
                <h1>Login</h1>
                <div class="login_input">
                    <input type="email" id="login_email" name="login_email" placeholder="Email">
                </div><br><br>
                <div class="login_input">
                    <input type="password" id="login_pass" name="login_pass" placeholder="Password">
                </div><br><br>
                <div class="remember_forgot">
                    <label><input type="checkbox">Remember me</label>
                    <a href="">forgot password</a>
                </div><br><br>
                <button type="submit" value="btn_login">Login</button><br><br>
                <div class="register_link">
                    <p>Don't have an account? <a href="">Register</a></p>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
